name: setup project tools
description: Install host packages and mise-managed project tools.

runs:
  using: composite
  steps:
  # Keep this OS package list intentionally tiny. Every package here is outside
  # mise and makes the CI runner image part of the build contract, so prefer
  # project manifests, .mise/config.toml, or tool-managed installs whenever
  # possible. Only add packages that are true header/linker/runtime requirements
  # for current CI jobs and cannot reasonably be provisioned by project tools.
  - name: install Linux system dependencies
    if: runner.os == 'Linux'
    shell: bash
    run: |
      sudo apt-get update
      sudo apt-get install -y libssl-dev
  - uses: jdx/mise-action@v4
  # mise exports RUSTUP_TOOLCHAIN after reading rust-toolchain.toml. rustup then
  # treats that variable as the selected toolchain and does not reconcile the
  # file's component/target lists. Read the shared toolchain file here so CI
  # installs the same channel, profile, components, and targets without relying
  # on runner image defaults.
  - name: install Rust components and targets
    shell: bash
    run: |
      toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
      profile="$(sed -n 's/^profile = "\(.*\)"/\1/p' rust-toolchain.toml)"
      components="$(sed -n 's/^components = \[\(.*\)\]/\1/p' rust-toolchain.toml | tr -d ' "')"
      targets="$(sed -n 's/^targets = \[\(.*\)\]/\1/p' rust-toolchain.toml | tr -d ' "')"

      test -n "$toolchain"
      test -n "$profile"
      test -n "$components"
      test -n "$targets"

      rustup toolchain install "$toolchain" \
        --profile "$profile" \
        --component "$components" \
        --target "$targets" \
        --no-self-update
